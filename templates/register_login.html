{% extends "base.html" %}

{% block content %}
<div class="container">
    <div style="display: flex; gap: 2rem; flex-wrap: wrap;">
        <!-- Login form (left) -->
        <div style="flex: 1; min-width: 250px;">
            <h2>Login</h2>
            {% if login_error %}
                <p style="color: red;">{{ login_error }}</p>
            {% endif %}
            <form method="post" action="{{ url_for('login') }}" style="margin-top: 1rem;">
                <input type="hidden" name="next" value="{{ next or '' }}">
                <input type="text" name="username" placeholder="Username" required style="margin-bottom: 10px; width: 100%; padding: 0.5rem;">
                <input type="password" name="password" placeholder="Password" required style="margin-bottom: 10px; width: 100%; padding: 0.5rem;">
                <button type="submit" class="btn" style="width: 100%;">Login</button>
            </form>
        </div>

        <!-- Register form (right) -->
        <div style="flex: 1; min-width: 250px;">
            <h2>Register</h2>
            <form method="post" action="{{ url_for('register') }}" style="margin-top: 1rem;">
                <input type="hidden" name="next" value="{{ next or '' }}">
                <input type="text" name="username" placeholder="Username" value="{{ form_username or '' }}" required style="margin-bottom: 10px; width: 100%; padding: 0.5rem;">
                <input type="password" name="password" placeholder="Password" required style="margin-bottom: 10px; width: 100%; padding: 0.5rem;">
                <select name="area" id="areaSelect" required style="margin-bottom: 10px; width: 100%; padding: 0.5rem;">
                    <option value="" disabled {% if not form_area %}selected{% endif %}>Select Area</option>
                    <option value="Hong Kong Island" {% if form_area == 'Hong Kong Island' %}selected{% endif %}>Hong Kong Island</option>
                    <option value="Kowloon" {% if form_area == 'Kowloon' %}selected{% endif %}>Kowloon</option>
                    <option value="New Territories" {% if form_area == 'New Territories' %}selected{% endif %}>New Territories</option>
                </select>
                <select name="district" id="districtSelect" required style="margin-bottom: 10px; width: 100%; padding: 0.5rem;">
                    <option value="" disabled selected>Select District</option>
                </select>
                <input type="text" name="estate_building" placeholder="Estate / Building" value="{{ form_estate_building or '' }}" style="margin-bottom: 10px; width: 100%; padding: 0.5rem;">
                
                <!-- Registration error message -->
                {% if register_error %}
                    <p style="color: red; margin-bottom: 5px;">{{ register_error }}</p>
                {% endif %}
                
                <div style="margin-bottom: 10px;">
                    <label>
                        <input type="checkbox" name="disclaimer">
                        I acknowledge that the platform is not liable for food safety and all sharing is at my own risk.
                    </label>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Register</button>
            </form>
        </div>
    </div>
</div>

<script>
    initDistrictDropdown('areaSelect', 'districtSelect', "{{ form_district or '' }}", true);
</script>
{% endblock %}
